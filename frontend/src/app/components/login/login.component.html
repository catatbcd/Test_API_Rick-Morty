<div class="max-w-md mx-auto mt-16 p-6 rounded-xl shadow-lg bg-slate-100 dark:bg-slate-900 transition-colors">
  <h2 class="text-2xl font-semibold text-center text-slate-900 dark:text-white mb-6">Iniciar sesión</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-1" for="email">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="tucorreo@ejemplo.com"
        class="w-full px-4 py-2 rounded-md border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-300"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-1" for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        placeholder="••••••••"
        class="w-full px-4 py-2 rounded-md border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-300"
      />
    </div>

    <div *ngIf="error" class="text-sm text-red-600 dark:text-red-400">
      {{ error }}
    </div>

    <button
      type="submit"
      class="w-full bg-sky-100 dark:bg-slate-900 text-slate-900 dark:text-white py-2 px-4 rounded-md hover:bg-orange-300 hover:text-white dark:hover:bg-orange-300 transition-colors"
    >
      Entrar
    </button>
  </form>
</div>
